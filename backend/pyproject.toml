[project]
name = "candidate-screening-platform-backend"
version = "1.0.0"
description = "Candidate Screening Platform API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "pymysql==1.1.1",
    "cryptography==42.0.8",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "python-multipart==0.0.9",
]

[tool.fastapi]
entrypoint = "app.main:app"